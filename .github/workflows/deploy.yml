name: Deploy to GitHub Pages

# Auto-compile the app and publish to GitHub Pages on every push to main
# (and on demand). The Protomaps hosted-API key is read from the repo secret
# VITE_PROTOMAPS_KEY so it never lives in the source; without it the build would
# fall back to the (unshipped) local basemap and the map would render blank.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; newer pushes supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # base must match the Pages sub-path (https://<user>.github.io/<repo>/).
      - run: npm run build -- --base=/volebna-mapa/
        env:
          VITE_PROTOMAPS_KEY: ${{ secrets.VITE_PROTOMAPS_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
